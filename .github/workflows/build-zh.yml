name: build-zh

on:
  workflow_dispatch:            # 手动触发（Actions 页面点 Run workflow）
  repository_dispatch:          # 跨仓库联动：汉化分支 push 时由对方仓库触发
    types: [rebuild-zh]
  push:
    branches: [ main ]
    paths: [ 'pluginmaster.json', '.github/workflows/build-zh.yml' ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write          # 允许把产物推回本仓库
    steps:
      - name: Checkout zh-repo
        uses: actions/checkout@v4
        with:
          path: zh-repo

      - name: Checkout InventoryTools (zh-cn-translation)
        uses: actions/checkout@v4
        with:
          repository: QuserH/InventoryTools
          ref: zh-cn-translation
          path: src/InventoryTools

      # 显式拉取汉化版子模块（不依赖 .gitmodules 里的上游 URL）
      - name: Checkout CriticalCommonLib (zh-cn-translation)
        uses: actions/checkout@v4
        with:
          repository: QuserH/CriticalCommonLib
          ref: zh-cn-translation
          path: src/InventoryTools/CriticalCommonLib

      - name: Checkout OtterGui (zh-cn-translation)
        uses: actions/checkout@v4
        with:
          repository: QuserH/OtterGui
          ref: zh-cn-translation
          path: src/InventoryTools/OtterGui

      - name: Checkout ARC (zh-cn-translation)
        uses: actions/checkout@v4
        with:
          repository: QuserH/ARC
          ref: zh-cn-translation
          path: src/ARC
          submodules: recursive

      - name: Checkout Deliveroo (zh-cn-translation)
        uses: actions/checkout@v4
        with:
          repository: QuserH/Deliveroo
          ref: zh-cn-translation
          path: src/Deliveroo

      - name: Setup Dalamud (release branch)
        uses: Blooym/setup-dalamud@v1
        with:
          branch: release

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build InventoryTools
        shell: pwsh
        working-directory: src/InventoryTools
        run: |
          # 先构建 OtterGui 解决方案（含 OtterGuiInternal 子项目），再构建主项目
          dotnet restore OtterGui/OtterGui.sln --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build OtterGui/OtterGui.sln -c Release --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build InventoryTools/InventoryTools.csproj -c Release --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build ARC
        shell: pwsh
        working-directory: src/ARC
        run: |
          # 先显式 restore 子模块项目（AutoRetainerAPI 的 Lumina/Newtonsoft/Dalamud 依赖）
          dotnet restore ARControl.sln --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build ARControl.sln -c Release --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Deliveroo
        shell: pwsh
        working-directory: src/Deliveroo
        run: |
          dotnet build Deliveroo/Deliveroo.csproj -c Release --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $itDir = "src/InventoryTools/InventoryTools/bin/Release"
          $arcDir = "src/ARC/ARControl/bin/Release"
          $deliDir = "src/Deliveroo/dist"    # Deliveroo 配置了 OutputPath=dist

          # 确保打包目录存在
          if (-not (Test-Path $itDir)) { throw "Missing $itDir" }
          if (-not (Test-Path $arcDir)) { throw "Missing $arcDir" }
          if (-not (Test-Path $deliDir)) { throw "Missing $deliDir" }

          Compress-Archive -Path (Join-Path $itDir '*') -DestinationPath "InventoryTools-1.15.0.9-zh.zip" -Force
          Compress-Archive -Path (Join-Path $arcDir '*') -DestinationPath "ARC-8.5-zh.zip" -Force
          Compress-Archive -Path (Join-Path $deliDir '*') -DestinationPath "Deliveroo-7.5.0.2-zh.zip" -Force

          # 更新 pluginmaster.json 的 LastUpdate 时间戳
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $json = Get-Content "zh-repo/pluginmaster.json" -Raw | ConvertFrom-Json
          foreach ($p in $json) { $p.LastUpdate = $now }
          $json | ConvertTo-Json -Depth 5 | Set-Content "zh-repo/pluginmaster.json" -Encoding UTF8

      - name: Copy ZIPs into zh-repo
        shell: pwsh
        run: |
          Copy-Item -Path "ARC-8.5-zh.zip" -Destination "zh-repo/ARC-8.5-zh.zip" -Force
          Copy-Item -Path "Deliveroo-7.5.0.2-zh.zip" -Destination "zh-repo/Deliveroo-7.5.0.2-zh.zip" -Force
          Copy-Item -Path "InventoryTools-1.15.0.9-zh.zip" -Destination "zh-repo/InventoryTools-1.15.0.9-zh.zip" -Force

      - name: Commit and push
        shell: pwsh
        working-directory: zh-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto: rebuild zh-CN packages [skip ci]" || echo "nothing to commit"
          git push
