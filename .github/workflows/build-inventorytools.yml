name: build-inventorytools

on:
  workflow_dispatch:
  repository_dispatch:
    types: [rebuild-inventorytools]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout zh-repo
        uses: actions/checkout@v4
        with:
          path: zh-repo

      - name: Checkout InventoryTools
        uses: actions/checkout@v4
        with:
          repository: QuserH/InventoryTools
          ref: zh-cn-translation
          path: src/InventoryTools

      - name: Checkout CriticalCommonLib
        uses: actions/checkout@v4
        with:
          repository: QuserH/CriticalCommonLib
          ref: zh-cn-translation
          path: src/InventoryTools/CriticalCommonLib

      - name: Checkout OtterGui
        uses: actions/checkout@v4
        with:
          repository: QuserH/OtterGui
          ref: zh-cn-translation
          path: src/InventoryTools/OtterGui
          submodules: recursive

      - name: Setup Dalamud
        uses: Blooym/setup-dalamud@v1
        with:
          branch: release

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build InventoryTools
        shell: pwsh
        working-directory: src/InventoryTools
        run: |
          dotnet restore OtterGui/OtterGui.sln --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build OtterGui/OtterGui.sln -c Release --nologo -v q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build InventoryTools/InventoryTools.csproj -c Release --nologo -v q

      - name: Package and publish InventoryTools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = "src/InventoryTools/InventoryTools/bin/Release"
          $manifest = Get-Content (Join-Path $output "InventoryTools.json") -Raw | ConvertFrom-Json
          $version = $manifest.AssemblyVersion
          $zipName = "InventoryTools-$version-zh.zip"
          Compress-Archive -Path (Join-Path $output '*') -DestinationPath $zipName -Force

          $masterPath = "zh-repo/pluginmaster.json"
          $plugins = Get-Content $masterPath -Raw | ConvertFrom-Json
          foreach ($plugin in $plugins) {
            if ($plugin.InternalName -eq "InventoryTools") {
              $plugin.AssemblyVersion = $version
              $plugin.LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
              $plugin.DownloadLinkInstall = "https://raw.githubusercontent.com/QuserH/zh-repo/main/$zipName"
              $plugin.DownloadLinkUpdate = "https://raw.githubusercontent.com/QuserH/zh-repo/main/$zipName"
            }
          }
          $plugins | ConvertTo-Json -Depth 5 | Set-Content $masterPath -Encoding UTF8
          Copy-Item -Path $zipName -Destination "zh-repo/$zipName" -Force

      - name: Commit and push
        shell: pwsh
        working-directory: zh-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json InventoryTools-*-zh.zip
          git commit -m "auto: rebuild InventoryTools zh-CN package [skip ci]" || echo "nothing to commit"
          git push
